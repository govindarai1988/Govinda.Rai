<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" role="img"
     aria-label="Code editor window showing a Playwright test written in C# that navigates to a page, enters a VIN, selects a trim and asserts the result, finishing with a passing test.">
  <defs>
    <linearGradient id="cw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141B27"/>
      <stop offset="1" stop-color="#0B1017"/>
    </linearGradient>
    <linearGradient id="cw-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#7B6CF0"/>
    </linearGradient>
    <clipPath id="cw-clip"><rect x="0" y="0" width="640" height="366" rx="16"/></clipPath>
  </defs>

  <!-- Animation is progressive enhancement: every line's resting state is
       visible (opacity 1). The keyframes only fade it IN. If CSS animation is
       unavailable, or the reader prefers reduced motion, the full snippet just
       shows immediately. -->
  <style>
    .l { opacity: 1; }
    .bar { width: 300px; }
    @keyframes cw-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cw-grow { from { width: 0; } to { width: 300px; } }
    @keyframes cw-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: no-preference) {
      .l { animation: cw-in .3s linear both; }
      .l1 { animation-delay: .2s }  .l2 { animation-delay: .5s }
      .l3 { animation-delay: .8s }  .l4 { animation-delay: 1.1s }
      .l5 { animation-delay: 1.4s } .l6 { animation-delay: 1.7s }
      .l7 { animation-delay: 2.0s } .l8 { animation-delay: 2.3s }
      .l9 { animation-delay: 2.6s } .l10 { animation-delay: 2.9s }
      .l11 { animation-delay: 3.3s }
      .bar { animation: cw-grow 1.1s ease-out .1s both; }
      .caret { animation: cw-blink 1s steps(1) infinite; }
    }
  </style>

  <g clip-path="url(#cw-clip)">
    <rect width="640" height="366" fill="url(#cw-bg)"/>

    <!-- title bar -->
    <rect width="640" height="42" fill="#0E131D"/>
    <line x1="0" y1="42" x2="640" y2="42" stroke="#222C3B" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="5" fill="#d95926"/>
    <circle cx="41" cy="21" r="5" fill="#c98500"/>
    <circle cx="60" cy="21" r="5" fill="#199e70"/>
    <text x="84" y="26" font-family="Consolas, monospace" font-size="12.5" fill="#76859A">CheckoutTests.cs</text>
    <rect x="536" y="12" width="86" height="19" rx="9" fill="#3987e5" fill-opacity=".16"/>
    <text x="579" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif"
          font-size="11" font-weight="700" fill="#8FBEF5">C# · NUnit</text>

    <g font-family="Consolas, 'Cascadia Code', monospace" font-size="13.5">
      <g fill="#3D4A5C" font-size="12">
        <text x="22" y="76">1</text><text x="22" y="100">2</text><text x="22" y="124">3</text>
        <text x="22" y="148">4</text><text x="22" y="172">5</text><text x="22" y="196">6</text>
        <text x="22" y="220">7</text><text x="22" y="244">8</text><text x="22" y="268">9</text>
        <text x="18" y="292">10</text><text x="18" y="316">11</text>
      </g>

      <g transform="translate(48,0)">
        <text xml:space="preserve" class="l l1" y="76"><tspan fill="#7B6CF0">[Test]</tspan></text>
        <text xml:space="preserve" class="l l2" y="100"><tspan fill="#c98500">public async Task</tspan><tspan fill="#EEF3F9"> ValuationFlow_PersistsTrim()</tspan></text>
        <text xml:space="preserve" class="l l3" y="124" fill="#EEF3F9">{</text>
        <text xml:space="preserve" class="l l4" y="148"><tspan fill="#EEF3F9">    await </tspan><tspan fill="#4FCB9B">Page</tspan><tspan fill="#EEF3F9">.GotoAsync(</tspan><tspan fill="#F0916B">"/appraisal"</tspan><tspan fill="#EEF3F9">);</tspan></text>
        <text xml:space="preserve" class="l l5" y="172"><tspan fill="#EEF3F9">    await </tspan><tspan fill="#4FCB9B">Vehicle</tspan><tspan fill="#EEF3F9">.EnterVin(vin);</tspan></text>
        <text xml:space="preserve" class="l l6" y="196"><tspan fill="#EEF3F9">    await </tspan><tspan fill="#4FCB9B">Vehicle</tspan><tspan fill="#EEF3F9">.SelectTrim(</tspan><tspan fill="#F0916B">"Limited"</tspan><tspan fill="#EEF3F9">);</tspan></text>
        <text xml:space="preserve" class="l l7" y="220" fill="#76859A">    // media sync is asynchronous</text>
        <text xml:space="preserve" class="l l8" y="244"><tspan fill="#EEF3F9">    await </tspan><tspan fill="#4FCB9B">Expect</tspan><tspan fill="#EEF3F9">(Summary.Trim)</tspan></text>
        <text xml:space="preserve" class="l l9" y="268"><tspan fill="#EEF3F9">        .ToHaveTextAsync(</tspan><tspan fill="#F0916B">"Limited"</tspan><tspan fill="#EEF3F9">);</tspan></text>
        <text xml:space="preserve" class="l l10" y="292" fill="#EEF3F9">}</text>
        <rect class="caret" x="8" y="282" width="8" height="15" fill="#8FBEF5"/>
      </g>
    </g>

    <!-- pass strip -->
    <g class="l l11">
      <rect x="0" y="330" width="640" height="36" fill="#0B1017"/>
      <line x1="0" y1="330" x2="640" y2="330" stroke="#222C3B" stroke-width="1.5"/>
      <circle cx="26" cy="348" r="7" fill="none" stroke="#199e70" stroke-width="2"/>
      <path d="M22.5 348 l2.8 3 5-6" stroke="#4FCB9B" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="44" y="353" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#4FCB9B">Test passed</text>
      <text x="620" y="353" text-anchor="end" font-family="Consolas, monospace"
            font-size="12" fill="#76859A">illustrative example</text>
      <rect class="bar" x="130" y="345" height="5" rx="2.5" fill="url(#cw-bar)"/>
    </g>

    <rect width="640" height="366" rx="16" fill="none" stroke="#222C3B" stroke-width="2"/>
  </g>
</svg>
