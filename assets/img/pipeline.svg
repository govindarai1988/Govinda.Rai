<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img"
     aria-label="Illustration of a continuous delivery pipeline with automated quality gates at build, test, performance and release stages">
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2a78d6" stop-opacity="0.15"/>
      <stop offset="0.5"  stop-color="#2a78d6" stop-opacity="0.85"/>
      <stop offset="1"    stop-color="#5B4FCF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F4EE"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <style>
    /* hide the travelling pulse for readers who prefer reduced motion; every
       other element in this diagram is static and visible by default */
    @media (prefers-reduced-motion: reduce) { .pulse { display: none; } }
  </style>

  <!-- ambient glow -->
  <ellipse cx="320" cy="130" rx="250" ry="70" fill="#2a78d6" opacity="0.09" filter="url(#soft)"/>

  <!-- main track -->
  <path d="M56 130 H584" stroke="url(#track)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- travelling pulse -->
  <circle class="pulse" r="5" fill="#2a78d6">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M56 130 H584"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- stage nodes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#414B59" text-anchor="middle">
    <!-- build -->
    <g>
      <rect x="24" y="98" width="64" height="64" rx="15" fill="url(#plate)" stroke="#E2DCD0"/>
      <path d="M44 130 h24 M56 118 v24" stroke="#2a78d6" stroke-width="2.4" stroke-linecap="round"/>
      <text x="56" y="182">Build</text>
    </g>
    <!-- automated tests -->
    <g>
      <rect x="156" y="98" width="64" height="64" rx="15" fill="url(#plate)" stroke="#E2DCD0"/>
      <path d="M176 130 l7 8 14-16" stroke="#2a78d6" stroke-width="2.6" stroke-linecap="round"
            stroke-linejoin="round" fill="none"/>
      <text x="188" y="182">Automated tests</text>
    </g>
    <!-- api / contract -->
    <g>
      <rect x="288" y="98" width="64" height="64" rx="15" fill="url(#plate)" stroke="#E2DCD0"/>
      <path d="M306 130 h28 M320 116 v28" stroke="#5B4FCF" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="320" cy="130" r="7" fill="none" stroke="#5B4FCF" stroke-width="2.2"/>
      <text x="320" y="182">API &amp; contract</text>
    </g>
    <!-- performance -->
    <g>
      <rect x="420" y="98" width="64" height="64" rx="15" fill="url(#plate)" stroke="#E2DCD0"/>
      <path d="M438 142 l10 -14 8 8 10 -18" stroke="#c9531d" stroke-width="2.6" stroke-linecap="round"
            stroke-linejoin="round" fill="none"/>
      <text x="452" y="182">Performance</text>
    </g>
    <!-- release -->
    <g>
      <rect x="552" y="98" width="64" height="64" rx="15" fill="url(#plate)" stroke="#E2DCD0"/>
      <path d="M584 116 v22 M576 130 l8 8 8 -8" stroke="#2a78d6" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="584" y="182">Release</text>
    </g>
  </g>

  <!-- observability feedback loop -->
  <path d="M584 92 C584 44 320 44 320 44 C320 44 56 44 56 92"
        stroke="#5B4FCF" stroke-width="2" stroke-dasharray="5 6" fill="none" opacity="0.65"/>
  <text x="320" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11.5" fill="#57616F" letter-spacing="1.4">OBSERVABILITY FEEDBACK</text>

  <!-- AI assist marker -->
  <g transform="translate(320,212)">
    <rect x="-74" y="-15" width="148" height="30" rx="15" fill="#EAF2FD" stroke="#2a78d6" stroke-opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="12" fill="#1F68C2">AI-assisted at every gate</text>
  </g>
</svg>
